name: Acton

on:
  push:
    branches: [main, dev, v3, v4, v5]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: acton-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Acton
        id: setup-acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676
        with:
          version: "1.1.0"
          save-cache: true

      - name: Cache project
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .acton
            build/cache
          key: acton-${{ runner.os }}-${{ steps.setup-acton.outputs.acton-version }}-${{ hashFiles('Acton.toml', '**/*.tolk') }}
          restore-keys: |
            acton-${{ runner.os }}-${{ steps.setup-acton.outputs.acton-version }}-

      - name: Build
        run: acton build

      - name: Generated wrappers
        run: |
          acton wrapper SubdomainItem
          acton wrapper SubdomainCollection
          acton wrapper SubdomainFactory
          git diff --exit-code -- wrappers

      - name: Test and coverage
        run: acton test tests --coverage --coverage-format text --coverage-file coverage.txt --coverage-minimum-percent 81

      - name: Telemint mainnet fork
        run: acton script scripts/verify-telemint-fork.tolk --fork-net mainnet --fork-block-number 80702445

      - name: Factory critical mutations
        run: acton test tests --mutate --mutate-contract SubdomainFactory --mutation-levels critical --mutation-minimum-percent 70

      - name: Collection critical mutations
        run: acton test tests --mutate --mutate-contract SubdomainCollection --mutation-levels critical --mutation-minimum-percent 98

      - name: Item critical mutations
        run: acton test tests --mutate --mutate-contract SubdomainItem --mutation-levels critical --mutation-minimum-percent 95

      - name: Check
        run: acton check

      - name: Format
        run: acton fmt --check
